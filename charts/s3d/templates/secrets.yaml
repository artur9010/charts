{{- if .Values.createSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName | quote }}
  labels:
    {{- include "s3d.labels" . | nindent 4 }}
type: Opaque
stringData:
  S3D_ADMIN_PASSWORD: {{ required "secretContent.S3D_ADMIN_PASSWORD is required when createSecret is true" .Values.secretContent.S3D_ADMIN_PASSWORD | quote }}
{{- end }}
