image:
  repository: ghcr.io/siafoundation/s3d
  pullPolicy: IfNotPresent
  tag: "0.2.1@sha256:9e5821b2539507e24e062bea234fd9e0c556aed50e7336ca803505c43fc3058f"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: ""

# secretName is the name of the Secret holding S3D_ADMIN_PASSWORD (the admin API password, required by s3d)
secretName: "s3d"
# createSecret creates the Secret from secretContent; by default you create it yourself beforehand
createSecret: false
secretContent:
  S3D_ADMIN_PASSWORD: ""

# setupMode replaces s3d with "sleep infinity" so you can run the interactive
# "kubectl exec -it s3d-0 -- s3d login" on first install. Set it back to false afterwards.
setupMode: false

# apiAddress is the address the S3 API listens on (passed as -api.s3)
apiAddress: ":8000"
# apiHTTPSAddress also serves the S3 API over HTTPS with a self-signed certificate, e.g. ":8443" (disabled when empty)
apiHTTPSAddress: ""
# adminAddress is the address of the admin API (metrics, status, flush); it must differ from the S3 API addresses
adminAddress: "127.0.0.1:8001"

persistence:
  enabled: true
  size: 8Gi
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  annotations: {}

log:
  stdout:
    enabled: true
    level: info
    format: human
    enableANSI: true
  file:
    enabled: false  # if you don't have any log collecting in cluster, enable it
    level: info
    format: json
    path: ""

sia:
  # sia.hostBases are the bases for virtual-hosted-style addressing (rendered as s3.hostBases)
  hostBases: []
  # sia.diskUsageLimit is the max number of bytes buffered on disk pending upload (0 disables the limit).
  # Keep it below persistence.size. Default 6 GiB.
  diskUsageLimit: 6442450944
  # sia.uploadThreads is the number of object groups uploaded to Sia concurrently
  uploadThreads: 4
  # sia.dataShards is the number of shards each slab is split into
  dataShards: 10
  # sia.parityShards is the number of recovery shards added to each slab
  parityShards: 20

resources: {}
  # limits:
  #   cpu: 2000m
  #   memory: 4Gi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

nodeSelector: {}

affinity: {}

tolerations: []

topologySpreadConstraints: []

automountServiceAccountToken: false
enableServiceLinks: false

securityContext: {}
  # runAsUser: 1000
  # runAsGroup: 1000
  # fsGroup: 1000

podAnnotations: {}

podLabels: {}

service:
  s3:
    type: ClusterIP
    port: 8000
    # service.s3.httpsPort is used only when apiHTTPSAddress is set
    httpsPort: 8443
    annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: s3d.example.com
      paths:
        - path: /
          pathType: Prefix
          svcName: s3d
          svcPort: 8000
  tls: []
    # - secretName: s3d-tls
    #   hosts:
    #     - s3d.example.com
