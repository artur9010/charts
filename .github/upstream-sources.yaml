# Upstream source repositories of the software our charts ship, for the
# renovate-changelog workflow (.github/scripts/upstream-source.sh).
# A bump of an image or subchart missing from this file is reviewed without its source,
# and the PR comment says so.
#
# images:    image repository in values.yaml -> GitHub repo. Git tags are looked up
#            as "<tag>" and "v<tag>".
# subcharts: dependency name in Chart.yaml -> GitHub repo and the git tag of a
#            chart release ({version} is the subchart version).
images:
  cloudflare/cloudflared:
    repo: cloudflare/cloudflared
  ghcr.io/siafoundation/renterd:
    repo: SiaFoundation/renterd
  ghcr.io/siafoundation/s3d:
    repo: SiaFoundation/s3d
subcharts:
  ingress-nginx:
    repo: kubernetes/ingress-nginx
    tag: helm-chart-{version}
