name: Lint

on:
  pull_request:
    paths:
      - 'charts/**'
      - 'ct.yaml'
  workflow_dispatch:     # Allow manual triggers

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      # Lints changed charts and fails when a changed chart has no version bump
      - name: Lint charts
        run: ct lint --config ct.yaml
