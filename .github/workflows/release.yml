name: Release

on:
  push:
    branches:
      - master
    paths:
      - 'charts/**'
  workflow_dispatch:     # Allow manual triggers

permissions:
  contents: write   # GitHub Releases and gh-pages
  packages: write   # GHCR
  id-token: write   # keyless cosign signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # chart-releaser does not add dependency repositories on its own
      - name: Add dependency repositories
        run: helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx

      # Per-chart notes from the commits that touched charts/<chart>/ since its previous
      # tag. The list goes into Chart.yaml as artifacthub.io/changes in the working tree
      # only, so it is packaged into the .tgz and index.yaml without a commit to master.
      # yq is preinstalled on ubuntu-latest.
      - name: Generate release notes
        run: |
          for dir in charts/*/; do
            chart=$(basename "$dir")
            .github/scripts/release-notes.sh "$chart" "$RUNNER_TEMP/notes"
            changes=$RUNNER_TEMP/notes/$chart.changes.yaml
            if [ -f "$changes" ]; then
              CHANGES=$(cat "$changes") yq -i '.annotations."artifacthub.io/changes" = strenv(CHANGES) | .annotations."artifacthub.io/changes" style="literal"' "$dir/Chart.yaml"
            fi
          done

      # Packages charts changed since the latest tag, creates a GitHub Release per
      # chart version and commits the package and index.yaml to gh-pages
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@df287104677278f869ca5480bd260358397cc3f9 # v1.8.0
        with:
          packages_with_index: true
          mark_as_latest: false
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # chart-releaser sets the chart description as the release body, replace it
      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            name=$(helm show chart "$pkg" | awk '/^name:/ {print $2}')
            version=$(helm show chart "$pkg" | awk '/^version:/ {print $2}')
            notes=$RUNNER_TEMP/notes/$name.md
            if [ -f "$notes" ]; then
              gh release edit "$name-$version" --notes-file "$notes"
            fi
          done

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Push and sign charts in GHCR
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}/charts
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          echo "$TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          for pkg in .cr-release-packages/*.tgz; do
            name=$(helm show chart "$pkg" | awk '/^name:/ {print $2}')
            version=$(helm show chart "$pkg" | awk '/^version:/ {print $2}')
            if helm show chart "oci://$REGISTRY/$name" --version "$version" >/dev/null 2>&1; then
              echo "$name $version already exists in $REGISTRY, skipping"
              continue
            fi
            digest=$(helm push "$pkg" "oci://$REGISTRY" 2>&1 | tee /dev/stderr | awk '/^Digest:/ {print $2}')
            cosign sign --yes "$REGISTRY/$name@$digest"
          done
